name: Обновление каталогов ЗАРАЕКБ

on:
  schedule:
    - cron: '0 3 * * 1'    # раз в неделю — понедельник 03:00 UTC
  workflow_dispatch:        # ручной запуск из вкладки Actions
    inputs:
      scope:
        description: 'Что обновить'
        required: true
        default: 'zara'
        type: choice
        options:
          - zara
          - all

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: pip install requests

      - name: Парсинг каталогов
        env:
          SF_KEY: ${{ secrets.SF_KEY }}
          OUT_DIR: ${{ github.workspace }}
          UPDATE_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'all' }}
          ZARA_DETAIL_WORKERS: 16
        run: |
          echo "UPDATE_SCOPE=$UPDATE_SCOPE"
          if [ "$UPDATE_SCOPE" = "all" ]; then
            python scripts/inditex_parse.py massimodutti || true
            python scripts/inditex_parse.py bershka || true
            python scripts/inditex_parse.py stradivarius || true
            python scripts/inditex_parse.py oysho || true
            python scripts/inditex_parse.py zarahome --bycat || true
          fi
          if [ "$UPDATE_SCOPE" = "all" ] || [ "$UPDATE_SCOPE" = "zara" ]; then
            python scripts/zara_parse.py || true
          fi

      - name: Уведомление в Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python scripts/notify_changes.py

      - name: Коммит обновлений
        run: |
          git config user.name "zaraekb-bot"
          git config user.email "bot@ly-x.com"
          git add products-*.json
          if git diff --cached --quiet; then
            echo "Изменений в каталогах нет."
            exit 0
          fi
          git commit -m "Авто-обновление каталогов $(date +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push retry $i..."; sleep 10
          done
          echo "push не удался"; exit 1
