name: Обновление каталогов ЗАРАЕКБ

on:
  schedule:
    - cron: '0 3 1-7,15-21 * 1'  # полный парсинг — 1-й и 3-й понедельник месяца
    - cron: '0 4 * * 2,4,6' # вт/чт/сб — быстрый поиск изменений Zara
  workflow_dispatch:        # ручной запуск из вкладки Actions
    inputs:
      scope:
        description: 'Что обновить'
        required: true
        default: 'changes'
        type: choice
        options:
          - balance
          - changes
          - zara
          - all

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: pip install requests

      - name: Проверка баланса ScrapingFish
        env:
          SF_KEY: ${{ secrets.SF_KEY }}
          SF_MIN_LEFT: 100
          SF_BALANCE_FILE: scrapingfish-balance.json
        run: |
          python scripts/check_scrapingfish_balance.py
          {
            echo "### Баланс ScrapingFish перед парсингом"
            python - <<'PY'
          import json
          with open("scrapingfish-balance.json", encoding="utf-8") as f:
              data = json.load(f)
          print(f"- Осталось: {data['left']} из {data['total']} ({data['percent']}%)")
          print(f"- Использовано: {data['used']}")
          for pack in data.get("packs", []):
              print(f"- Пакет: {pack.get('left')}/{pack.get('total')}, действует до {pack.get('expires')}")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Парсинг каталогов
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope != 'balance' }}
        env:
          SF_KEY: ${{ secrets.SF_KEY }}
          OUT_DIR: ${{ github.workspace }}
          UPDATE_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || (github.event.schedule == '0 3 1-7,15-21 * 1' && 'all' || 'changes') }}
          SF_DIRECT_FIRST: 1
          ZARA_DETAIL_WORKERS: 16
        run: |
          set -euo pipefail
          echo "UPDATE_SCOPE=$UPDATE_SCOPE"
          if [ "$UPDATE_SCOPE" = "changes" ]; then
            python scripts/zara_incremental_sync.py
            python scripts/inditex_incremental_sync.py massimodutti
            python scripts/inditex_incremental_sync.py bershka
            python scripts/inditex_incremental_sync.py stradivarius
            python scripts/inditex_incremental_sync.py oysho
            python scripts/inditex_incremental_sync.py zarahome --bycat
          fi
          if [ "$UPDATE_SCOPE" = "all" ]; then
            python scripts/inditex_parse.py massimodutti
            python scripts/inditex_parse.py bershka
            python scripts/inditex_parse.py stradivarius
            python scripts/inditex_parse.py oysho
            python scripts/inditex_parse.py zarahome --bycat
          fi
          if [ "$UPDATE_SCOPE" = "all" ] || [ "$UPDATE_SCOPE" = "zara" ]; then
            python scripts/zara_parse.py
          fi
          python scripts/apply_price_table.py
          python scripts/generate_lite_catalogs.py
          python scripts/update_hero_slides.py

      - name: Уведомление в Telegram
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope != 'balance' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SF_BALANCE_FILE: scrapingfish-balance.json
        run: python scripts/notify_changes.py

      - name: Коммит обновлений
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope != 'balance' }}
        run: |
          git config user.name "zaraekb-bot"
          git config user.email "bot@zaraekb.ru"
          git add products-*.json product-details hero-slides.json scrapingfish-balance.json
          if git diff --cached --quiet; then
            echo "Изменений в каталогах нет."
            exit 0
          fi
          git commit -m "Авто-обновление каталогов $(date +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push retry $i..."; sleep 10
          done
          echo "push не удался"; exit 1

      - name: Синхронизация zaraekb.ru
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope != 'balance' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOST:-}" ] || [ -z "${DEPLOY_USER:-}" ] || [ -z "${DEPLOY_PATH:-}" ] || [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "Деплой пропущен: добавьте DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, DEPLOY_SSH_KEY в GitHub Secrets."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/zaraekb_deploy_key
          chmod 600 ~/.ssh/zaraekb_deploy_key
          rsync -az -e "ssh -i ~/.ssh/zaraekb_deploy_key -o StrictHostKeyChecking=no" \
            index.html brands.json hero.jpg robots.txt sitemap.xml products-*.json hero-slides.json product-details/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
