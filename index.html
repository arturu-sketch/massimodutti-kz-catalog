<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Massimo Dutti KZ — Каталог | @massimodutti_ekb</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fff; color: #222; }
.container { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
header { text-align: center; padding: 30px 20px; background: #fff; border-bottom: 1px solid #e5e5e5; }
header h1 { font-size: 22px; font-weight: 400; letter-spacing: 4px; color: #111; text-transform: uppercase; }
header p { color: #888; margin-top: 6px; font-size: 13px; }
header .price-note { color: #222; font-size: 12px; margin-top: 4px; }
.stats { display: flex; justify-content: center; gap: 24px; margin-top: 12px; font-size: 12px; color: #888; }
.stats span { color: #222; font-weight: 500; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 16px 0; border-bottom: 1px solid #e5e5e5; margin-bottom: 20px; }
.filters input { background: #f5f5f5; border: none; color: #222; padding: 10px 14px; border-radius: 0; width: 240px; font-size: 13px; }
.filters input::placeholder { color: #aaa; }
.filters select { background: #f5f5f5; border: none; color: #222; padding: 10px 14px; border-radius: 0; font-size: 13px; cursor: pointer; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-top: 1px solid #e5e5e5; border-left: 1px solid #e5e5e5; }
.card { border-right: 1px solid #e5e5e5; border-bottom: 1px solid #e5e5e5; overflow: hidden; transition: opacity .2s; cursor: pointer; background: #fff; }
.card:hover { opacity: 0.85; }
.card-img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #f5f5f5; display: block; }
.card-body { padding: 12px 14px 16px; }
.card-body h3 { font-size: 12px; font-weight: 400; color: #555; line-height: 1.3; min-height: 30px; text-transform: uppercase; letter-spacing: 0.5px; }
.card-body .category { font-size: 10px; color: #bbb; text-transform: uppercase; margin-top: 6px; letter-spacing: 1px; }
.card-body .price { margin-top: 8px; }
.card-body .price .rub { font-size: 15px; font-weight: 500; color: #222; }
.card-body .price .kzt { font-size: 12px; color: #999; margin-top: 2px; }
.card-body .price .old { text-decoration: line-through; color: #ccc; font-size: 13px; margin-left: 6px; font-weight: 400; }
.card-body .ref { font-size: 10px; color: #ddd; margin-top: 6px; }
.badge-sale { background: #c00; color: #fff; font-size: 10px; padding: 2px 6px; margin-left: 6px; font-weight: 500; }
.out-of-stock { opacity: 0.4; }
.out-of-stock .card-img { filter: grayscale(1); }
#status { text-align: center; padding: 16px; color: #888; font-size: 12px; border-top: 1px solid #e5e5e5; }
footer { text-align: center; padding: 30px; color: #ccc; font-size: 11px; }

@media (max-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 768px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .grid { grid-template-columns: repeat(1, 1fr); } }
</style>
</head>
<body>
<header>
  <h1>Massimo Dutti · Казахстан</h1>
  <p>Независимый байер-сервис · Екатеринбург</p>
  <p class="price-note">Цена в Казахстане (₸) → твоя цена с доставкой (₽)</p>
  <div class="stats">Товаров: <span id="total-count">0</span> · Категорий: <span id="cat-count">0</span></div>
</header>

<div class="container">
<div class="filters">
  <input type="text" id="search" placeholder="Поиск..." oninput="render()">
  <select id="cat-filter" onchange="render()"><option value="">Все</option></select>
  <select id="sort" onchange="render()">
    <option value="new">Новинки</option>
    <option value="cheap">Сначала дешёвые</option>
    <option value="expensive">Сначала дорогие</option>
  </select>
</div>
<div class="grid" id="grid"></div>
<div id="status"></div>
</div>

<footer>@massimodutti_ekb · Независимый сервис</footer>

<script>
let products = [];

fetch('products.json').then(r=>r.json()).then(data => {
  products = data;
  const cats = [...new Set(products.filter(p=>p.section).map(p=>p.section))].sort();
  const sel = document.getElementById('cat-filter');
  cats.forEach(c => { const o = document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o); });
  document.getElementById('total-count').textContent = products.length;
  document.getElementById('cat-count').textContent = cats.length;
  render();
});

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const cat = document.getElementById('cat-filter').value;
  const sort = document.getElementById('sort').value;
  
  let filtered = products.filter(p => {
    if (cat && p.section !== cat) return false;
    if (q && !p.name.toLowerCase().includes(q) && !p.ref.toLowerCase().includes(q)) return false;
    return true;
  });
  
  if (sort === 'cheap') filtered.sort((a,b) => (a.price_rub||999999) - (b.price_rub||999999));
  else if (sort === 'expensive') filtered.sort((a,b) => (b.price_rub||0) - (a.price_rub||0));
  else filtered.sort((a,b) => (b.ref||'').localeCompare(a.ref||''));
  
  const grid = document.getElementById('grid');
  grid.innerHTML = filtered.map(p => {
    const isStock = p.in_stock !== false;
    const imgUrl = p.image || `https://static.massimodutti.net/3/photos/2026/V/0/2/p/${p.ref.split('/')[0]}/${p.ref.split('/')[1]}/800/${p.ref.split('/')[0]}${p.ref.split('/')[1]}800_1_1_3.jpg`;
    const sale = p.price_old_rub ? `<span class="badge-sale">-${Math.round((1-p.price_rub/p.price_old_rub)*100)}%</span>` : '';
    return `<div class="card${isStock?'':' out-of-stock'}">
      <img class="card-img" src="${imgUrl}" alt="${p.name}" loading="lazy">
      <div class="card-body">
        <h3>${p.name}</h3>
        <div class="category">${p.section||''}${p.family ? ' · '+p.family : ''}</div>
        <div class="price">
          <div class="rub">${p.price_rub ? p.price_rub.toLocaleString()+' ₽' : ''}${sale}</div>
          <div class="kzt">${p.price_kzt ? p.price_kzt.toLocaleString()+' ₸' : ''}${p.price_old_rub ? '<span class="old">'+p.price_old_rub.toLocaleString()+' ₽</span>' : ''}</div>
        </div>
        <div class="ref">${p.ref}</div>
      </div>
    </div>`;
  }).join('');
  
  document.getElementById('status').textContent = `Все ${filtered.length} товаров`;
}
</script>
</body>
</html>
